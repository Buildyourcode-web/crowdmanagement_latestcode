# ==============================================================================
# Complete Production Nginx Configuration for BYC Frontend (CPU Instance)
# Path: /etc/nginx/nginx.conf or mounted directly in Docker / Host
# ==============================================================================

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging Formats
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # High-Performance File Transfer
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Request Buffer Limits
    client_body_buffer_size 128k;
    client_max_body_size 50M;      # Allows large face image uploads for FRS enrollment
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Upstream definition for GPU Backend Instance
    # REPLACE WITH YOUR GPU INSTANCE PRIVATE OR PUBLIC IP:
    upstream gpu_backend {
        server 127.0.0.1:8000; # Change to e.g. 10.0.0.5:8000 or <GPU_INSTANCE_IP>:8000
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ----------------------------------------------------------------------
        # 1. Reverse Proxy to GPU Backend (REST API)
        # ----------------------------------------------------------------------
        location /api/ {
            proxy_pass http://gpu_backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 15s;
            proxy_read_timeout 90s;
            proxy_send_timeout 90s;
            proxy_buffering on;
            proxy_buffers 16 64k;
        }

        # ----------------------------------------------------------------------
        # 2. Reverse Proxy to GPU Backend (WebSocket Live Telemetry Bus)
        # ----------------------------------------------------------------------
        location /ws/ {
            proxy_pass http://gpu_backend/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;   # Keep live telemetry stream open for 24h
            proxy_send_timeout 86400s;
        }

        # ----------------------------------------------------------------------
        # 3. Static & Media Proxies from Backend
        # ----------------------------------------------------------------------
        location /media/ {
            proxy_pass http://gpu_backend/media/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /static/ {
            proxy_pass http://gpu_backend/static/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ----------------------------------------------------------------------
        # 4. Vite Frontend Static Assets Caching (Immutable chunks)
        # ----------------------------------------------------------------------
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ----------------------------------------------------------------------
        # 5. SPA Client-Side Routing Fallback
        # ----------------------------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;
            # Never cache index.html so frontend updates are immediate
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # Healthcheck endpoint
        location /health {
            access_log off;
            return 200 "OK\n";
        }
    }
}
